# Checks on every PR (QA, levels U and I): shellcheck, bats, manifests.
name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }

env:
  SHELLCHECK_VERSION: v0.11.0
  BATS_VERSION: v1.12.0
  KUBECONFORM_VERSION: v0.7.0
  YQ_VERSION: v4.47.2
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d

jobs:
  shellcheck:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to Ubuntu 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" | tar -xJ
          sc=./shellcheck-$SHELLCHECK_VERSION/shellcheck
          $sc -x installer
          $sc -x tests/manifests.sh tests/e2e/*.sh tests/kind/*.sh tests/vm/*.sh dashboards/normalize.sh .github/scripts/*.sh bin/hammurapi-deploy bin/nabu-deploy bin/landing-deploy bin/ingress-forward bin/stand-autostart
          $sc -s bash tests/unit/*.bats tests/unit/helpers.bash

  actionlint:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to Ubuntu 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint (QUAL-01)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  unit:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to Ubuntu 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # deploy-component.yml for the tests INS-05 is in the public repository hammurapi.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { repository: GreenOnGrey/hammurapi, path: .hammurapi, persist-credentials: false }
      - name: yq
        run: |
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: bats
        env: { DEPLOY_WORKFLOW: "${{ github.workspace }}/.hammurapi/.github/workflows/deploy-component.yml" }
        run: |
          git clone --quiet --depth 1 --branch "$BATS_VERSION" https://github.com/bats-core/bats-core.git /tmp/bats
          /tmp/bats/bin/bats tests/unit

  manifests:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to Ubuntu 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          set -a; source config/versions.env; set +a
          curl -fsSL "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz" -o /tmp/helm.tgz
          echo "$HELM_SHA256  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp && sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz" | tar -xz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Manifests for 8 combinations of storage modes
        run: bash tests/manifests.sh

  # The external target on a real cluster: both bounds of Kubernetes (FTR.INFRA.INST-0001 tech §6.1).
  kind:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to Ubuntu 26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: install, kubernetes: v1.35.8 }
          - { scenario: install, kubernetes: v1.37.0 }
          - { scenario: ingress, kubernetes: v1.37.0 }
          - { scenario: external, kubernetes: v1.37.0 }
          - { scenario: no-policy, kubernetes: v1.37.0 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        env: { KUBERNETES: "${{ matrix.kubernetes }}" }
        run: |
          set -a; source config/versions.env; set +a
          curl -fsSL "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz" -o /tmp/helm.tgz
          echo "$HELM_SHA256  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp && sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -fsSL "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64" -o /tmp/kind
          echo "$KIND_SHA256  /tmp/kind" | sha256sum -c -
          sudo install /tmp/kind /usr/local/bin/kind
          # kubectl follows the server: the installer stops at two minor versions apart.
          curl -fsSL "https://dl.k8s.io/release/$KUBERNETES/bin/linux/amd64/kubectl" -o /tmp/kubectl
          sudo install /tmp/kubectl /usr/local/bin/kubectl
      - name: ${{ matrix.scenario }} on Kubernetes ${{ matrix.kubernetes }}
        env: { KIND_NODE: "kindest/node:${{ matrix.kubernetes }}" }
        run: bash tests/kind/kind.sh "${{ matrix.scenario }}"
