# RHEL's relatives on a real machine: a Rocky cloud image under KVM with SELinux enforcing and firewalld
# (FTR.INFRA.INST-0001 R9). Runs when the code of the machine changes, and by hand.
name: el
on:
  workflow_dispatch:
  pull_request:
    paths:
      - bin/ingress-forward
      - bin/stand-autostart
      - config/versions.env
      - installer
      - lib/cluster.sh
      - lib/host.sh
      - lib/prereqs.sh
      - lib/public.sh
      - tests/el/**
      - .github/workflows/el.yml
permissions: { contents: read }

jobs:
  rocky:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to Ubuntu 26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        release: ["9", "10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: QEMU with KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils genisoimage
      - name: Rocky ${{ matrix.release }}
        run: bash tests/el/el.sh "${{ matrix.release }}" full
