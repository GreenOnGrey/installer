# Release of installer (R18; FTR.HMR.INFRA-0002, R15): a tag vX.Y.Z first publishes
# the charts with the version X.Y.Z, then, only on success,
# rolls the tag out to production.
# To repeat a rollout or return to an earlier version, run it manually from a tag:
# published chart versions are not overwritten. There is no automatic rollback.
# Production configuration and secrets stay on the machine (/opt/hammurapi-infra) and do not
# pass through the workflow; GitHub keeps only the access to the machine.
name: deploy-prod
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Tag to roll out (vX.Y.Z)", required: true, type: string }
concurrency: { group: deploy-prod, cancel-in-progress: false }
permissions: { contents: read, id-token: write }   # id-token for gcp-iap

env:
  DEPLOY_TRANSPORT: ${{ vars.DEPLOY_TRANSPORT || 'ssh' }}
  PROD_DIR: /opt/hammurapi-infra

jobs:
  # Charts hammurapi-core, hammurapi-web, nabu-core, nabu-web and landing in oci://ghcr.io/<organization>/charts:
  # the chart version equals the stand's version (tech spec FTR.HMR.INFRA-0002, §11).
  publish-charts:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to Ubuntu 26
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ $INPUT_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$INPUT_TAG' is not in the format vX.Y.Z"; exit 1; }
          echo "tag=$INPUT_TAG" >>"$GITHUB_OUTPUT"
          echo "version=${INPUT_TAG#v}" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "refs/tags/${{ steps.tag.outputs.tag }}" }
      - name: Helm
        run: |
          set -a; source config/versions.env; set +a
          curl -fsSL "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz" -o /tmp/helm.tgz
          echo "$HELM_SHA256  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp && sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: lint, package, push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          repo="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p dist
          echo "## Charts $VERSION" >>"$GITHUB_STEP_SUMMARY"
          for chart in hammurapi-core hammurapi-web nabu-core nabu-web landing; do
            # A repeated rollout (rollback) of the same tag: the version is in the registry, do not overwrite.
            if helm show chart "$repo/$chart" --version "$VERSION" >/dev/null 2>&1; then
              echo "- $repo/$chart:$VERSION is already published" >>"$GITHUB_STEP_SUMMARY"
              continue
            fi
            helm lint "charts/$chart" --set image.tag=v0.0.0 --set publicBaseDomain=example.org
            helm package "charts/$chart" --version "$VERSION" --app-version "$VERSION" -d dist
            helm push "dist/$chart-$VERSION.tgz" "$repo"
            echo "- $repo/$chart:$VERSION" >>"$GITHUB_STEP_SUMMARY"
          done

  deploy:
    needs: publish-charts
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to Ubuntu 26
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      - name: Resolve tag and commit
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag || github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          tag=$(bash .github/scripts/resolve-tag.sh "$INPUT_TAG")
          git fetch --tags --force --quiet
          sha=$(git rev-list -n 1 "refs/tags/$tag") || { echo "::error::tag $tag not found"; exit 1; }
          [[ $ACTOR =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid name $ACTOR"; exit 1; }
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "Rollout of $tag ($sha), initiated by $ACTOR"

      - name: Machine access (ssh)
        if: env.DEPLOY_TRANSPORT == 'ssh'
        env:
          PROD_HOST: ${{ secrets.PROD_HOST || vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: bash .github/scripts/ssh-setup.sh

      - name: Machine access (gcp-iap, Workload Identity Federation)
        if: env.DEPLOY_TRANSPORT == 'gcp-iap'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: gcloud
        if: env.DEPLOY_TRANSPORT == 'gcp-iap'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Rollout
        id: up
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
          TAG: ${{ steps.tag.outputs.tag }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ steps.tag.outputs.sha }}
          # Public access of the stand (FTR.HMR.INFRA-0002, R17–R21).
          PUBLIC_ACCESS: ${{ vars.PUBLIC_ACCESS }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL || vars.ACME_EMAIL }}
          ACME_ISSUER: ${{ vars.ACME_ISSUER }}
          PUBLIC_BASE_DOMAIN: ${{ vars.PUBLIC_BASE_DOMAIN }}
          PUBLIC_IP: ${{ vars.PUBLIC_IP }}
          # Grafana sign-in through GitHub (R20): the organization's OAuth app.
          GRAFANA_GITHUB_CLIENT_ID: ${{ vars.GRAFANA_GITHUB_CLIENT_ID }}
          GRAFANA_GITHUB_ORG: ${{ vars.GRAFANA_GITHUB_ORG }}
          GRAFANA_GITHUB_CLIENT_SECRET: ${{ secrets.GRAFANA_GITHUB_CLIENT_SECRET }}
          # MCP servers of the stand (FTR.NAB.CMN-0006): options, not secrets.
          MCP_DOCLING: ${{ vars.MCP_DOCLING }}
          MCP_SEARCH: ${{ vars.MCP_SEARCH }}
          MCP_YANDEX_MAIL: ${{ vars.MCP_YANDEX_MAIL }}
          MCP_DOCGEN: ${{ vars.MCP_DOCGEN }}
          MCP_DOCLING_MAX_MB: ${{ vars.MCP_DOCLING_MAX_MB }}
          MCP_SEARCH_ENGINES: ${{ vars.MCP_SEARCH_ENGINES }}
        # The production machine needs no access to GitHub (deploy keys are forbidden by the
        # organization's policy): the runner passes it the tag export over the same SSH.
        run: |
          remote() { bash .github/scripts/remote.sh "$@"; }
          remote "mkdir -p $PROD_DIR && cat >$PROD_DIR/deploy-remote.sh" <.github/scripts/deploy-remote.sh
          git archive --format=tar.gz "refs/tags/$TAG" | remote "bash $PROD_DIR/deploy-remote.sh unpack $PROD_DIR $TAG"
          if [[ -n $GRAFANA_GITHUB_CLIENT_ID && -z $GRAFANA_GITHUB_CLIENT_SECRET ]]; then
            echo "::error::the variable GRAFANA_GITHUB_CLIENT_ID is set, but the secret GRAFANA_GITHUB_CLIENT_SECRET is missing"
            exit 1
          fi
          # Set parameters go to the stdin of the rollout (a secret reaches neither argv nor disk).
          for k in PUBLIC_ACCESS ACME_EMAIL ACME_ISSUER PUBLIC_BASE_DOMAIN PUBLIC_IP \
            GRAFANA_GITHUB_CLIENT_ID GRAFANA_GITHUB_ORG GRAFANA_GITHUB_CLIENT_SECRET \
            MCP_DOCLING MCP_SEARCH MCP_YANDEX_MAIL MCP_DOCGEN MCP_DOCLING_MAX_MB MCP_SEARCH_ENGINES; do
            if [[ -n ${!k} ]]; then printf '%s=%s\n' "$k" "$(printf '%s' "${!k}" | tr -d '\r\n')"; fi
          done | remote "bash $PROD_DIR/deploy-remote.sh up $PROD_DIR $TAG $SHA $ACTOR"

      - name: Status
        if: always() && steps.tag.outcome == 'success'
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
        run: |
          bash .github/scripts/remote.sh "bash $PROD_DIR/deploy-remote.sh status $PROD_DIR ${{ steps.tag.outputs.tag }}" >status.json || true
          {
            echo "## Production: ${{ steps.tag.outputs.tag }}"
            echo
            if jq -e '.profile' status.json >/dev/null 2>&1; then
              jq -r '"Deployed: \(.version.tag // "?") (\(.version.commit // "?")), \(.version.deployedAt // "?"), \(.version.deployedBy // "?")",
                "Cluster: \(.profile.status // "?"), Kubernetes \(.profile.kubernetes // "?")",
                "Memory: \(.resources.requestedPercent // "?")% of minikube requested by components", "",
                "| Check | Result | Message |", "|---|---|---|",
                ((.checks // [])[] | "| \(.name) | \(if .ok then "✓" else "✗" end) | \(.message) |")' status.json
            elif jq -e '.error' status.json >/dev/null 2>&1; then
              echo "status: $(jq -r .error status.json)"
            else
              echo "status is unavailable"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
