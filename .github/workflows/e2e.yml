# End-to-end на временной машине Google Cloud (QA, уровень E). Только ручной
# запуск: перед релизом репозитория и при изменении версий, values/ или charts/.
name: e2e
on:
  workflow_dispatch:
    inputs:
      zone: { description: "Зона Google Cloud", default: europe-west1-b, type: string }
      keep: { description: "Не удалять машину после прогона", default: false, type: boolean }
concurrency: { group: e2e, cancel-in-progress: false }
permissions: { contents: read, id-token: write }

jobs:
  e2e:
    runs-on: ubuntu-24.04  # фиксировано: ubuntu-latest переезжает на Ubuntu 26
    environment: e2e
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: e2e
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_ZONE: ${{ inputs.zone }}
          KEEP: ${{ inputs.keep && '1' || '0' }}
          REPORT: ${{ github.workspace }}/e2e-report.md
        run: |
          mkdir -p .work
          bash tests/e2e/e2e.sh
      - name: Отчёт
        if: always()
        run: if [ -f e2e-report.md ]; then cat e2e-report.md >>"$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: e2e-report, path: e2e-report.md, if-no-files-found: ignore }
