# End-to-end on a temporary Google Cloud machine (QA, level E). Manual only:
# before a release of the repository and when versions, values/ or charts/ change.
name: e2e
on:
  workflow_dispatch:
    inputs:
      zone: { description: "Google Cloud zone", default: europe-west1-b, type: string }
      keep: { description: "Keep the machine after the run", default: false, type: boolean }
      upgrade_from: { description: "Only the upgrade from this tag (PROD-01)", default: "", type: string }
concurrency: { group: e2e, cancel-in-progress: false }
permissions: { contents: read, id-token: write }

jobs:
  e2e:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to Ubuntu 26
    environment: e2e
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }  # the tag of upgrade_from
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: e2e
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_ZONE: ${{ inputs.zone }}
          KEEP: ${{ inputs.keep && '1' || '0' }}
          E2E_UPGRADE_FROM: ${{ inputs.upgrade_from }}
          REPORT: ${{ github.workspace }}/e2e-report.md
        run: |
          mkdir -p .work
          bash tests/e2e/e2e.sh
      - name: Report
        if: always()
        run: if [ -f e2e-report.md ]; then cat e2e-report.md >>"$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: e2e-report, path: e2e-report.md, if-no-files-found: ignore }
