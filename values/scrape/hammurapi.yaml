    # --- Hammurapi (FTR.HMR.INFRA-0002) и Nabu (FTR.NAB.CMN-0001 arch §11): поды с аннотацией prometheus.io/scrape ---
    - job_name: hammurapi
      kubernetes_sd_configs: [{ role: pod, namespaces: { names: [hammurapi, hammurapi-runners, nabu, nabu-sandboxes] } }]
      relabel_configs:
        - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], regex: "true", action: keep }
        - { source_labels: [__meta_kubernetes_pod_phase], regex: Running, action: keep }
        - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number], action: keep_if_equal }
        - { source_labels: [__meta_kubernetes_namespace], target_label: namespace }
        - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
        - { source_labels: [__meta_kubernetes_pod_container_name], target_label: container }
        - { source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component], target_label: component }
