    # --- Postgres (CloudNativePG): the instance, port metrics (9187) ---
    - job_name: postgres
      kubernetes_sd_configs: [{ role: pod, namespaces: { names: [storages] } }]
      relabel_configs:
        - { source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster], regex: hammurapi-pg, action: keep }
        - { source_labels: [__meta_kubernetes_pod_container_port_name], regex: metrics, action: keep }
        - { source_labels: [__meta_kubernetes_namespace], target_label: namespace }
        - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
