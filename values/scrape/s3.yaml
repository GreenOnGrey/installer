    # --- Объектное хранилище (SeaweedFS all-in-one): порт метрик 9324 ---
    - job_name: s3
      kubernetes_sd_configs: [{ role: pod, namespaces: { names: [storages] } }]
      relabel_configs:
        - { source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], regex: seaweedfs, action: keep }
        - { source_labels: [__meta_kubernetes_pod_container_port_name], regex: server-metrics, action: keep }
        - { source_labels: [__meta_kubernetes_namespace], target_label: namespace }
        - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
