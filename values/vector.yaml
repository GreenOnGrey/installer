# Vector (role Agent, DaemonSet): logs of all containers of all namespaces (R9) →
# VictoriaLogs through the Elasticsearch-compatible endpoint.
role: Agent
service: { enabled: false }
serviceHeadless: { enabled: false }
containerPorts:
  - { name: prom-exporter, containerPort: 9090, protocol: TCP }
customConfig:
  data_dir: /vector-data-dir
  api: { enabled: false }
  sources:
    # Look for new log files every 5 s, not once a minute by default: otherwise
    # lines of short-lived pods (and the probe of the logs check) lag up to a minute.
    k8s: { type: kubernetes_logs, glob_minimum_cooldown_ms: 5000 }
    internal: { type: internal_metrics }
  transforms:
    shape:
      type: remap
      inputs: [k8s]
      source: |
        .namespace = .kubernetes.pod_namespace
        .pod = .kubernetes.pod_name
        .container = .kubernetes.container_name
        .node = .kubernetes.pod_node_name
        del(.kubernetes)
        del(.file)
        # The level of a line is a field of its own: VictoriaLogs keeps the line as
        # `_msg` and does not parse it, while the «Log level rules» of the Grafana
        # datasource classify by a field (FTR.INFRA.INST-0001 R36).
        parsed = parse_json(.message) ?? null
        if is_object(parsed) {
          lvl, err = to_string(parsed.level)
          if err == null && lvl != "" {
            .level = downcase(lvl)
          }
        } else {
          found = parse_regex(.message, r'^(?P<lvl>TRACE|DEBUG|INFO|WARN|WARNING|ERROR|FATAL|CRITICAL)\b') ?? null
          if found != null {
            .level = downcase(to_string(found.lvl))
          }
        }
  sinks:
    victorialogs:
      type: elasticsearch
      inputs: [shape]
      endpoints: ["http://victoria-logs-victoria-logs-single-server:9428/insert/elasticsearch/"]
      mode: bulk
      api_version: v8
      compression: gzip
      healthcheck: { enabled: false }
      query:
        _msg_field: message
        _time_field: timestamp
        _stream_fields: namespace,pod,container
      buffer: { type: memory, max_events: 5000 }
    metrics:
      type: prometheus_exporter
      inputs: [internal]
      address: 0.0.0.0:9090
resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 300m, memory: 256Mi } }
podAnnotations: { prometheus.io/scrape: "true", prometheus.io/port: "9090" }
