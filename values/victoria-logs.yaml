# VictoriaLogs single. Retention is VL_RETENTION, volume size is VL_STORAGE.
# A separate release vector collects logs; the Vector built into the chart stays off.
server:
  retentionPeriod: 3d
  persistentVolume: { enabled: true, size: 10Gi }
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
  podAnnotations: { prometheus.io/scrape: "true", prometheus.io/port: "9428" }
vector:
  enabled: false
