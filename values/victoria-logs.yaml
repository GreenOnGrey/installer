# VictoriaLogs single. Срок хранения — VL_RETENTION, размер тома — VL_STORAGE.
# Логи собирает отдельный релиз vector, встроенный в чарт Vector не включается.
server:
  retentionPeriod: 3d
  persistentVolume: { enabled: true, size: 10Gi }
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
  podAnnotations: { prometheus.io/scrape: "true", prometheus.io/port: "9428" }
vector:
  enabled: false
