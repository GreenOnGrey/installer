# vmagent collects metrics (R8). installer assembles the scrape jobs (config.scrape_configs)
# from values/scrape/*.yaml: jobs of built-in storages
# are enabled only in internal mode.
mode: deployment
remoteWrite:
  - url: http://victoria-metrics-victoria-metrics-single-server:8428/api/v1/write
extraArgs:
  envflag.enable: true
  envflag.prefix: VM_
  # The cluster label is needed by the dashboard Kubernetes / Views / Global.
  remoteWrite.label: cluster=hammurapi
  promscrape.dropOriginalLabels: true
resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 200m, memory: 256Mi } }
podAnnotations: { prometheus.io/scrape: "true", prometheus.io/port: "8429" }
config:
  global: { scrape_interval: 30s, scrape_timeout: 10s }
