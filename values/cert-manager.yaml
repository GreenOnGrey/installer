# cert-manager (FTR.HMR.INFRA-0002, R19): Let's Encrypt certificates, the HTTP-01 check
# through Traefik. The chart installs CRDs.
crds: { enabled: true, keep: true }
resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { cpu: 200m, memory: 192Mi } }
webhook:
  resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } }
cainjector:
  resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { cpu: 200m, memory: 192Mi } }
startupapicheck:
  resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 100m, memory: 64Mi } }
# The HTTP-01 solver is a temporary pod for the time of issuance.
extraArgs: []
acmesolver:
  image: {}
