# Traefik (FTR.HMR.INFRA-0002, R17, R19): ingress controller, service LoadBalancer
# (MetalLB gives the address; the specific one is service.spec.loadBalancerIP from up).
# Routing uses standard Ingress objects with the class traefik.
deployment:
  replicas: 1
  podAnnotations: { prometheus.io/scrape: "true", prometheus.io/port: "9100" }
ingressClass: { enabled: true, isDefaultClass: false, name: traefik }
providers:
  kubernetesIngress: { enabled: true }
  kubernetesCRD: { enabled: true }   # required for TLSStore
ports:
  web:
    # cert-manager HTTP-01 checks bypass the redirect.
    allowACMEByPass: true
    http:
      redirections:
        entryPoint: { to: websecure, scheme: https, permanent: true }
  websecure:
    http:
      tls: { enabled: true }
# One certificate for web., api., grafana. is the default one: Ingress objects in
# other namespaces turn TLS on without secrets of their own.
tlsStore:
  default:
    defaultCertificate: { secretName: hammurapi-public }
service:
  spec:
    type: LoadBalancer
    externalTrafficPolicy: Local   # keeps the client address
accessLog: { enabled: true }
resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
