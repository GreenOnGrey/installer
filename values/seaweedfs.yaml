# Object storage: SeaweedFS all-in-one (master, volume, filer and S3 gateway in
# one pod) instead of MinIO, since MinIO community images are no longer published.
# S3 credentials come from the secret s3-seaweedfs-config (created by installer).
master: { enabled: false }
volume: { enabled: false }
filer: { enabled: false }
allInOne:
  enabled: true
  s3:
    enabled: true
    enableAuth: true
    existingConfigSecret: s3-seaweedfs-config
    createBucketsHook:
      resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
    # installer sets the bucket name from S3_BUCKET.
    createBuckets: []
  data:
    type: persistentVolumeClaim
    size: 10Gi
  service:
    type: ClusterIP
  podAnnotations: {}
  resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
