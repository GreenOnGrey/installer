# Объектное хранилище: SeaweedFS all-in-one (мастер, том, filer и S3-шлюз в
# одном поде) вместо MinIO — образы MinIO community больше не публикуются.
# Учётные данные S3 — из секрета s3-seaweedfs-config (создаёт hammurapi-infra.sh).
master: { enabled: false }
volume: { enabled: false }
filer: { enabled: false }
allInOne:
  enabled: true
  s3:
    enabled: true
    enableAuth: true
    existingConfigSecret: s3-seaweedfs-config
    createBucketsHook:
      resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
    # Имя бакета задаёт hammurapi-infra.sh из S3_BUCKET.
    createBuckets: []
  data:
    type: persistentVolumeClaim
    size: 10Gi
  service:
    type: ClusterIP
  podAnnotations: {}
  resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
