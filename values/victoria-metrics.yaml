# VictoriaMetrics single. Retention is VM_RETENTION, volume size is VM_STORAGE.
server:
  retentionPeriod: 7d
  persistentVolume: { enabled: true, size: 10Gi }
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
  podAnnotations: { prometheus.io/scrape: "true", prometheus.io/port: "8428" }
