# Grafana (R7). The administrator password comes from the secret grafana-admin; anonymous
# access and registration are off. Data sources have fixed UIDs,
# dashboards are ConfigMaps with the label grafana_dashboard (chart hammurapi-dashboards).
admin: { existingSecret: grafana-admin, userKey: admin-user, passwordKey: admin-password }
persistence: { enabled: true, size: 1Gi }
service: { type: ClusterIP, port: 80 }
grafana.ini:
  # The VictoriaLogs plugin installs before the server starts (needs internet access);
  # installer sets plugins.preinstall_sync from VL_PLUGIN_VERSION.
  plugins: { preinstall_sync: "" }
  auth.anonymous: { enabled: false }
  users: { allow_sign_up: false }
  analytics: { reporting_enabled: false, check_for_updates: false, check_for_plugin_updates: false }
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://victoria-metrics-victoria-metrics-single-server:8428
        isDefault: true
        editable: false
      - name: VictoriaLogs
        uid: victorialogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs-victoria-logs-single-server:9428
        editable: false
# Grafana alert rules (unified alerting; Grafana 11+ does not support rules in
# panels). See the state in Alerting → Alert rules; the stand sets up no
# notification channels.
alerting:
  rules.yaml:
    apiVersion: 1
    groups:
      - orgId: 1
        name: nabu-sandboxes
        folder: Nabu
        interval: 1m
        rules:
          # FTR.NAB.CMN-0008 tech §7.10: more than three start failures of a custom profile in 10 minutes
          - uid: nabu-sandbox-custom-start-failing
            title: NabuSandboxCustomStartFailing
            condition: C
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: victoriametrics
                model: { refId: A, instant: true, expr: 'sum(increase(nabu_sandbox_start_failures_total{profile_kind="custom"}[10m]))' }
              - refId: C
                datasourceUid: __expr__
                model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [3] } }] }
            for: 0s
            noDataState: OK
            execErrState: Error
            labels: { severity: warning }
            annotations:
              summary: Sandboxes of a custom profile do not start
              # the chart passes alerting through tpl: the Grafana template is escaped from Helm
              description: 'Start failures of a profile with kind=custom in 10 minutes: {{ "{{" }} $values.A {{ "}}" }}. See the dashboard Nabu sandboxes and the section Sandbox images in the Nabu admin area.'
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    searchNamespace: observability
    provider: { foldersFromFilesStructure: true, allowUiUpdates: false }
  # Measured on the stand: up to 100 MiB, CPU throttling 79% with the limit 100m.
  resources: { requests: { cpu: 20m, memory: 96Mi }, limits: { cpu: 200m, memory: 192Mi } }
initChownData:
  resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 50m, memory: 32Mi } }
testFramework: { enabled: false }
# Grafana 13 is heavier than the architecture assumed (300m / 256Mi): on the stand memory
# reached 254 MiB, CPU throttled 31%, and a start with the plugin install did not fit in
# the liveness probe, causing CrashLoopBackOff and a helm --wait timeout.
resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
# The first start installs the VictoriaLogs plugin and migrates the database, so give it time.
livenessProbe:
  httpGet: { path: /api/health, port: grafana }
  initialDelaySeconds: 180
  timeoutSeconds: 30
  failureThreshold: 10
podAnnotations: { prometheus.io/scrape: "true", prometheus.io/port: "3000" }
