# Grafana (R7). Пароль администратора — из секрета grafana-admin; анонимный
# доступ и регистрация выключены. Источники данных с фиксированными UID,
# дашборды — ConfigMap с меткой grafana_dashboard (чарт hammurapi-dashboards).
admin: { existingSecret: grafana-admin, userKey: admin-user, passwordKey: admin-password }
persistence: { enabled: true, size: 1Gi }
service: { type: ClusterIP, port: 80 }
grafana.ini:
  # Плагин VictoriaLogs ставится до старта сервера (нужен доступ в интернет);
  # hammurapi-infra.sh задаёт plugins.preinstall_sync из VL_PLUGIN_VERSION.
  plugins: { preinstall_sync: "" }
  auth.anonymous: { enabled: false }
  users: { allow_sign_up: false }
  analytics: { reporting_enabled: false, check_for_updates: false, check_for_plugin_updates: false }
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://victoria-metrics-victoria-metrics-single-server:8428
        isDefault: true
        editable: false
      - name: VictoriaLogs
        uid: victorialogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs-victoria-logs-single-server:9428
        editable: false
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    searchNamespace: observability
    provider: { foldersFromFilesStructure: true, allowUiUpdates: false }
  # Замер на стенде: до 100 МиБ, троттлинг CPU 79% при лимите 100m.
  resources: { requests: { cpu: 20m, memory: 96Mi }, limits: { cpu: 200m, memory: 192Mi } }
initChownData:
  resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 50m, memory: 32Mi } }
testFramework: { enabled: false }
# Grafana 13 тяжелее, чем закладывала архитектура (300m / 256Mi): на стенде память
# доходила до 254 МиБ, CPU троттлился 31%, старт с установкой плагина не укладывался
# в liveness-пробу — CrashLoopBackOff и таймаут helm --wait.
resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
# Первый старт ставит плагин VictoriaLogs и мигрирует базу — даём ему время.
livenessProbe:
  httpGet: { path: /api/health, port: grafana }
  initialDelaySeconds: 180
  timeoutSeconds: 30
  failureThreshold: 10
podAnnotations: { prometheus.io/scrape: "true", prometheus.io/port: "3000" }
