# Mode of each storage: internal deploys it in the cluster, external means
# a service of the same name points to the external host (R12).
postgres:
  mode: internal
  external: { host: "", port: 5432, isIP: false }
  image: ""                 # POSTGRES_IMAGE
  storage: 10Gi
  database: hammurapi
  owner: hammurapi
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }

kafka:
  mode: internal
  version: ""               # KAFKA_VERSION
  storage: 10Gi
  external: { host: "", port: 9092, isIP: false }
  heap: 512m
  resources: { requests: { cpu: 200m, memory: 1Gi }, limits: { cpu: "1", memory: 1536Mi } }
  exporterResources: { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 100m, memory: 128Mi } }

s3:
  mode: internal
  external: { host: "", port: 443, isIP: false }
  # Built-in object storage: SeaweedFS all-in-one, S3 on port 8333.
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: seaweedfs
    app.kubernetes.io/component: seaweedfs-all-in-one
  targetPort: 8333
