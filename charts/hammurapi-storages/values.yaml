# Mode of each storage: internal deploys it in the cluster, external means
# a service of the same name points to the external host (R12).
postgres:
  mode: internal
  external: { host: "", port: 5432, isIP: false }
  image: ""                 # POSTGRES_IMAGE
  storage: 10Gi
  database: hammurapi
  owner: hammurapi
  # One instance under this limit: both products share it. The collector of Nabu writes
  # notes and vectors in bulk, and with 512Mi the kubelet killed Postgres with OOMKilled
  # every half an hour of such a load (FTR.INFRA.INST-0001 R35).
  resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 2Gi } }
  # Tuned for the limit above: the defaults of Postgres 18 (shared_buffers 128MB,
  # max_connections 100, maintenance_work_mem 64MB, three autovacuum workers) do not
  # fit 512Mi, and a single connection of the collector may sort a batch of notes.
  parameters:
    shared_buffers: "512MB"
    effective_cache_size: "1536MB"
    work_mem: "8MB"
    maintenance_work_mem: "128MB"
    max_connections: "50"

kafka:
  mode: internal
  version: ""               # KAFKA_VERSION
  storage: 10Gi
  external: { host: "", port: 9092, isIP: false }
  heap: 512m
  resources: { requests: { cpu: 200m, memory: 1Gi }, limits: { cpu: "1", memory: 1536Mi } }
  exporterResources: { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 100m, memory: 128Mi } }

s3:
  mode: internal
  external: { host: "", port: 443, isIP: false }
  # Built-in object storage: SeaweedFS all-in-one, S3 on port 8333.
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: seaweedfs
    app.kubernetes.io/component: seaweedfs-all-in-one
  targetPort: 8333
