{{- if eq .Values.kafka.mode "internal" }}
# Kafka in KRaft mode: one node with the roles controller and broker (node pool
# single), the listener plain 9092 without authentication, JMX metrics and kafkaExporter.
# Topic and User Operators stay off to save resources.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: hammurapi
  labels: {{- include "storages.labels" . | nindent 4 }}
spec:
  kafka:
    version: {{ required "kafka.version is required" .Values.kafka.version | quote }}
    listeners:
      - { name: plain, port: 9092, type: internal, tls: false }
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: true
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef: { name: kafka-metrics, key: kafka-metrics.yaml }
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources: {{- toYaml .Values.kafka.exporterResources | nindent 6 }}
{{- end }}
