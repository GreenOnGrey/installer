{{- $d := required "publicBaseDomain is required" .Values.publicBaseDomain }}
{{- $web := printf "%s.%s" .Values.hosts.web $d }}
{{- $tag := required "image.tag is required (set by the rollout)" .Values.image.tag }}
{{- /* The site address: its own domain if set, otherwise the stand's host. */ -}}
{{- $site := .Values.domain | default $web }}
{{- define "landing.labels" -}}
app.kubernetes.io/name: landing
app.kubernetes.io/instance: {{ .Release.Name }}
app.kubernetes.io/component: web
app.kubernetes.io/version: {{ .Values.image.tag | quote }}
app.kubernetes.io/part-of: landing
app.kubernetes.io/managed-by: {{ .Release.Service }}
helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {{- include "landing.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: landing, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: {{- include "landing.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ $tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            # The site address in canonical links, hreflang, the sitemap: one image for any domain.
            - { name: SITE_URL, value: "https://{{ $site }}" }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {{- include "landing.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: landing, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  labels: {{- include "landing.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: [{ hosts: ["{{ $web }}"] }]
  rules:
    - host: "{{ $web }}"
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { name: http } } } }
{{- with .Values.domain }}
{{- $www := printf "www.%s" . }}
---
# Certificate of the own domain: the stand's shared certificate holds only its subdomains.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: landing-domain
  labels: {{- include "landing.labels" $ | nindent 4 }}
spec:
  secretName: landing-domain-tls
  issuerRef: { kind: ClusterIssuer, name: {{ $.Values.issuer }} }
  dnsNames: ["{{ . }}", "{{ $www }}"]
---
# www.<domain> → <domain>: the site has one address.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-redirect
  labels: {{- include "landing.labels" $ | nindent 4 }}
spec:
  redirectRegex:
    regex: "^https?://www\\.{{ . | replace "." "\\\\." }}/(.*)"
    replacement: "https://{{ . }}/${1}"
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: domain
  labels: {{- include "landing.labels" $ | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "{{ $.Release.Namespace }}-www-redirect@kubernetescrd"
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  tls: [{ hosts: ["{{ . }}", "{{ $www }}"], secretName: landing-domain-tls }]
  rules:
    {{- range list . $www }}
    - host: "{{ . }}"
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { name: http } } } }
    {{- end }}
{{- end }}
