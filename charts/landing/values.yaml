# Образ сайта; тег задаёт выкатка (landing-deploy).
image: { repository: ghcr.io/greenongrey/landing, tag: "", pullPolicy: IfNotPresent }
imagePullSecrets: [{ name: ghcr-pull }]

# Базовый домен: сайт на web.<домен>. Обязателен.
publicBaseDomain: ""
hosts: { web: web }

# Собственный домен сайта (необязателен), например greenongrey.tech. Тогда сайт
# открывается по https://<domain>, www.<domain> перенаправляется на него, а для
# обоих имён выпускается отдельный сертификат. Адрес web.<домен> продолжает работать.
domain: ""
# ClusterIssuer cert-manager для сертификата собственного домена.
issuer: letsencrypt

ingress:
  className: traefik

resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 200m, memory: 64Mi } }
