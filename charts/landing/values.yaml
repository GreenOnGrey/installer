# The site image; the rollout sets the tag (landing-deploy).
image: { repository: ghcr.io/greenongrey/landing, tag: "", pullPolicy: IfNotPresent }
imagePullSecrets: [{ name: ghcr-pull }]

# Base domain: the site on web.<domain>. Required.
publicBaseDomain: ""
hosts: { web: web }

# The site's own domain (optional), such as greenongrey.tech. The site then
# opens at https://<domain>, www.<domain> redirects to it, and both names get a
# separate certificate. The address web.<domain> keeps working.
domain: ""
# The cert-manager ClusterIssuer for the certificate of the own domain.
issuer: letsencrypt

ingress:
  className: traefik

resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 200m, memory: 64Mi } }
