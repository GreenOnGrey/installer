{{- if or .Values.sandboxes.enabled .Values.agents.enabled }}
# worker creates and deletes pods of personal sandboxes and agent pods, only in their
# namespace (FTR.NAB.CMN-0001 arch §5.2, FTR.NAB.CMN-0004 arch §3.1). Namespace
# nabu-deploy creates them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nabu-worker
  labels: {{- include "nabu.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.sandboxes.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nabu-sandboxes
  namespace: {{ .Values.sandboxes.namespace }}
  labels: {{- include "nabu.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete]
  # Preloading images of assigned profiles (FTR.NAB.CMN-0008 tech §5.6).
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get, list, watch, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nabu-worker
  namespace: {{ .Values.sandboxes.namespace }}
  labels: {{- include "nabu.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: nabu-sandboxes }
subjects:
  - { kind: ServiceAccount, name: nabu-worker, namespace: {{ .Release.Namespace }} }
{{- end }}
