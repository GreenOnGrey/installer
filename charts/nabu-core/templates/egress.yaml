{{- if .Values.egress.enabled }}
{{ include "nabu.deployment" (dict "root" . "name" "egress" "ports" (list (dict "name" "egress" "port" 3128)) "grace" 30) }}
---
# The egress gateway of sandboxes (FTR.HMR.CMN-0007 tech §3.5): HTTP CONNECT
# with a sandbox token, only to addresses of proxies granted to it.
apiVersion: v1
kind: Service
metadata:
  name: nabu-egress
  labels:
    {{- include "nabu.labels" . | nindent 4 }}
    app.kubernetes.io/component: egress
spec:
  type: ClusterIP
  selector: {{- include "nabu.selector" (dict "root" . "component" "egress") | nindent 4 }}
  ports:
    - { name: egress, port: 3128, targetPort: egress }
---
# Ingress to the gateway from sandboxes and api (proxy check); egress is open:
# the gateway itself limits addresses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress
  labels: {{- include "nabu.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: egress, app.kubernetes.io/name: nabu } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.sandboxes.namespace }} } }
          podSelector: { matchLabels: { nabu.io/egress: "true" } }
        - podSelector: { matchLabels: { app.kubernetes.io/component: api, app.kubernetes.io/name: nabu } }
      ports: [{ port: 3128 }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
      ports: [{ port: 9100 }]
{{- end }}
