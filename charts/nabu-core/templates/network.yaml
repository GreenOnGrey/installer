# Network policies (FTR.NAB.CMN-0001 arch §5.2, tech §7).
# Only api and worker reach the agent operator.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent
  labels: {{- include "nabu.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/component: agent, app.kubernetes.io/name: nabu } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/component: api, app.kubernetes.io/name: nabu } }
        - podSelector: { matchLabels: { app.kubernetes.io/component: worker, app.kubernetes.io/name: nabu } }
      ports: [{ port: 8090 }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
      ports: [{ port: 9100 }]
{{- if .Values.sandboxes.enabled }}
---
# Sandboxes: no ingress; egress to DNS, relay and the internal
# Nabu API, addresses from sandboxes.egressAllow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandboxes
  namespace: {{ .Values.sandboxes.namespace }}
  labels: {{- include "nabu.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} } }
          podSelector: { matchLabels: { app.kubernetes.io/component: relay, app.kubernetes.io/name: nabu } }
      ports: [{ port: 8085 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} } }
          podSelector: { matchLabels: { app.kubernetes.io/component: api, app.kubernetes.io/name: nabu } }
      ports: [{ port: 8081 }]
    {{- range .Values.sandboxes.egressAllow }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
    {{- end }}
{{- if .Values.egress.enabled }}
---
# Sandboxes with granted proxies (label nabu.io/egress) reach the egress gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandboxes-egress
  namespace: {{ .Values.sandboxes.namespace }}
  labels: {{- include "nabu.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { nabu.io/egress: "true" } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} } }
          podSelector: { matchLabels: { app.kubernetes.io/component: egress, app.kubernetes.io/name: nabu } }
      ports: [{ port: 3128 }]
{{- end }}
{{- end }}
