{{ include "nabu.deployment" (dict "root" . "name" "api" "ports" (list (dict "name" "http" "port" 8080) (dict "name" "internal" "port" 8081))) }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "nabu.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector: {{- include "nabu.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# The internal API (:8081): built-in MCP and MCP proxy for the agent operator,
# file sync for sandboxes.
apiVersion: v1
kind: Service
metadata:
  name: api-internal
  labels:
    {{- include "nabu.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector: {{- include "nabu.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: internal, port: 8081, targetPort: internal }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  labels:
    {{- include "nabu.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.ingress.clusterIssuer }}
  annotations: { cert-manager.io/cluster-issuer: {{ . | quote }} }
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  # The default Traefik certificate (the stand's shared one, with nabu. and nabu-api.), or with
  # clusterIssuer a secret of its own.
  {{- if .Values.ingress.tls }}
  tls: [{ hosts: [{{ include "nabu.api" . | quote }}]{{ if .Values.ingress.clusterIssuer }}, secretName: api-tls{{ end }} }]
  {{- end }}
  rules:
    - host: {{ include "nabu.api" . | quote }}
      http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend: { service: { name: api, port: { name: http } } }
          {{- end }}
          {{- range .Values.ingress.relayPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend: { service: { name: relay, port: { name: relay } } }
          {{- end }}
