# The core image with the Pi agent; the rollout sets the tag (nabu-deploy).
image: { repository: ghcr.io/greenongrey/nabu-core, tag: "", pullPolicy: IfNotPresent }
imagePullSecrets: [{ name: ghcr-pull }]

# Base domain: site nabu.<domain>, API nabu-api.<domain>. Required.
publicBaseDomain: ""
# Subdomains of the site and API (FTR.NAB.CMN-0001 arch §11).
hosts: { web: nabu, api: nabu-api }

# nabu-deploy creates secrets and configuration before Helm: the chart gets only
# references, and values stay out of the release history.
existingSecrets:
  config: nabu-secrets          # SECRETS_KEY, operator token, GitHub OAuth, Telegram, the LLM key of the first run
  configMap: nabu-config        # non-secret configuration from GitHub
  postgres: nabu-postgres-conn  # database nabu and user nabu
  kafka: kafka-conn             # a copy of the stand's secret
  s3: nabu-s3-conn              # bucket nabu

# Additional non-secret environment variables.
config: {}

# The shared pool: service agent runs and connection checks
# (FTR.NAB.CMN-0004 arch §3.3). Conversations run in owner pods, see agents.
agent:
  maxRuns: 10             # service agent runs per pod (AGENT_MAX_RUNS)
  idleTimeout: 15m        # session idle time before closing (also in owner pods)
  workSizeLimit: 4Gi      # session directories (/work)

# Agent pods: a pod per user and per group agent
# (FTR.NAB.CMN-0004 tech §7.2). nabu-deploy creates the namespace.
agents:
  enabled: true           # false: all sessions in the shared operator (AGENT_EXECUTOR=local)
  namespace: nabu-agents
  podsMax: 0              # pod count ceiling; 0 means by quota or actual placement
  maxSessions: 8          # sessions in a pod
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1", memory: 1Gi }
  workSizeLimit: 1GB
  idleTimeout: 15m        # idle time before a pod stops
  minIdle: 60s            # idle time after which a pod may give way
  queueTimeout: 10m       # longest wait of a turn in the queue
  scheduleTimeout: 15s    # with node autoscaling, the time for a node to appear
  startTimeout: 60s       # pod readiness deadline after placement
  startParallel: 10
  warm: { window: 3h, share: 0.3, max: 0 }
  # hard of the namespace ResourceQuota (pods, requests.cpu, requests.memory); empty means no quota.
  quota: {}
  # CIDRs of models inside the company network: pods reach the internet only on 443.
  egressAllow: []
  # The agent image in advance on every node: without it a cold start does not fit in 30 seconds.
  prepull: true

# Communications memory (FTR.NAB.CMN-0003 tech §12). An administrator allows the feature
# itself in Settings; this is the collection capacity.
memory:
  collectConcurrency: 40  # concurrent collector runs (MEMORY_COLLECT_CONCURRENCY)
  batchThreads: 20        # threads in the batch of one run
  runTimeout: 10m         # longest run time
  backfillDays: 30        # depth of the first collection
  backfillPoolShare: 0.3  # share of concurrent runs for the first collection
  gmailOverlap: 24h       # overlap of the Gmail search before the cursor
  # A separate operator pool for the collector. false: runs go to the shared pool agent.
  pool:
    enabled: true
    replicas: 1
    maxRuns: 40           # runs per pod; keep replicas × maxRuns at least collectConcurrency
    # Measured on production over 7 days (2026-10-24): CPU p95 1m, peak 10m; memory peak 95 MiB.
    # The first collection and spikes stay within the limit.
    resources: { requests: { cpu: 50m, memory: 192Mi }, limits: { cpu: "2", memory: 3Gi } }
    # The collection model at an external provider: the pool has internet on 443 (except
    # private ranges). false: the model is inside the company network, the internet is closed
    # entirely, and its addresses are listed in egressAllow.
    egressInternet: true
    # CIDRs of the collection model inside the company network.
    egressAllow: []

# Personal sandboxes (FTR.NAB.CMN-0001 arch §5.2).
sandboxes:
  enabled: true
  namespace: nabu-sandboxes
  idleTimeout: 30m
  cpu: "1"
  memory: 1Gi
  spaceQuota: 5GB
  # CIDRs sandboxes may connect to (package registries and so on).
  egressAllow: []
  # Built-in profiles of sandbox images (FTR.NAB.CMN-0008): repository; the tag is
  # the nabu version (image.tag). Empty means one nabu-core image, as before profiles.
  profiles:
    base: ghcr.io/greenongrey/nabu-sandbox-base
    documents: ghcr.io/greenongrey/nabu-sandbox-documents
    # FTR.HMR.CMN-0007 R25: Go, Python and JavaScript for code agents.
    code: ghcr.io/greenongrey/nabu-sandbox-code
  # Default profiles; an administrator changes them for personal and group agents in the panel.
  defaults: { personal: documents, group: documents, service: base }
  # Custom images of the install's team: only from allowedPrefixes (each
  # ends with /), with registry secrets in the sandbox namespace.
  customImages:
    enabled: false
    allowedPrefixes: []
    pullSecrets: []
  # How long a check of a custom image may take, with pulling.
  probeTimeout: 5m

ingress:
  className: traefik
  # A ClusterIssuer: the Ingress gets a certificate of its own, for controllers other than Traefik of the stand.
  clusterIssuer: ""
  # false: a load balancer in front terminates TLS and sends HTTP (TLS_TERMINATION=external): no tls section.
  tls: true
  # Public API prefixes; the service :9100 and internal :8081 are not routed.
  paths: [/api/, /admin/api/, /client/v1/, /hooks/, /auth/, /oauth/, /.well-known/]
  # The workspace channel (wss) is not open outside: workspaces of
  # calling services are gone (FTR.HMR.CMN-0007 R12), and sandboxes reach relay inside the cluster.
  relayPaths: []

cleaner:
  schedule: "30 3 * * *"

# Speech recognition (FTR.NAB.CHAT-0001 R19): the stand's option NABU_WHISPER.
# small on CPU with int8; large-v3-turbo is more accurate on Russian but heavier.
whisper:
  enabled: false
  image: onerahmet/openai-whisper-asr-webservice:v1.10.0
  model: small
  quantization: int8
  storage: 2Gi
  # the recognizer idles between messages: a small request leaves room for the pods of agents
  resources: { requests: { cpu: 50m, memory: 1Gi }, limits: { cpu: "2", memory: 2Gi } }

# The egress gateway of sandboxes (FTR.HMR.CMN-0007 tech §3.5): sandboxes with
# granted proxies go outside only through it; proxy addresses are in the Nabu admin area.
egress:
  enabled: true

replicas: { api: 1, worker: 1, agent: 1, relay: 1, egress: 2 }

resources:
  api:     { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
  worker:  { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
  agent:   { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "2", memory: 3Gi } }
  relay:   { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
  egress:  { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: "1", memory: 256Mi } }
  migrate: { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
  cleaner: { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }

podAnnotations: { prometheus.io/scrape: "true", prometheus.io/port: "9100" }
