# Образ core вместе с агентом Pi; тег задаёт выкатка (nabu-deploy).
image: { repository: ghcr.io/greenongrey/nabu-core, tag: "", pullPolicy: IfNotPresent }
imagePullSecrets: [{ name: ghcr-pull }]

# Базовый домен: сайт nabu.<домен>, API nabu-api.<домен>. Обязателен.
publicBaseDomain: ""
# Поддомены сайта и API (FTR.NAB.CMN-0001 arch §11).
hosts: { web: nabu, api: nabu-api }

# Секреты и конфигурация создаёт nabu-deploy до Helm: чарт получает только
# ссылки, значения не попадают в историю релизов.
existingSecrets:
  config: nabu-secrets          # SECRETS_KEY, токен оператора, OAuth GitHub, Telegram, ключ LLM первого запуска
  configMap: nabu-config        # несекретная конфигурация из GitHub
  postgres: nabu-postgres-conn  # база nabu и пользователь nabu
  kafka: kafka-conn             # копия секрета стенда
  s3: nabu-s3-conn              # бакет nabu

# Дополнительные несекретные переменные окружения.
config: {}

# Общий пул: запуски служебных агентов и проверки подключений
# (FTR.NAB.CMN-0004 arch §3.3). Разговоры идут в подах владельцев — agents.
agent:
  maxRuns: 10             # запусков служебных агентов на под (AGENT_MAX_RUNS)
  idleTimeout: 15m        # простой сессии до закрытия (и в подах владельцев)
  workSizeLimit: 4Gi      # каталоги сессий (/work)

# Поды агентов: под на пользователя и на группового агента
# (FTR.NAB.CMN-0004 tech §7.2). Namespace создаёт nabu-deploy.
agents:
  enabled: true           # false — все сессии в общем операторе (AGENT_EXECUTOR=local)
  namespace: nabu-agents
  podsMax: 0              # потолок числа подов; 0 — по квоте или по факту размещения
  maxSessions: 8          # сессий в поде
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1", memory: 1Gi }
  workSizeLimit: 1GB
  idleTimeout: 15m        # простой до остановки пода
  minIdle: 60s            # простой, после которого под может уступить место
  queueTimeout: 10m       # наибольшее ожидание хода в очереди
  scheduleTimeout: 15s    # при автомасштабировании узлов — время появления узла
  startTimeout: 60s       # срок готовности пода после размещения
  startParallel: 10
  warm: { window: 3h, share: 0.3, max: 0 }
  # hard для ResourceQuota namespace (pods, requests.cpu, requests.memory); пусто — без квоты.
  quota: {}
  # CIDR моделей внутри сети компании: в интернет поды ходят только на 443.
  egressAllow: []
  # Образ агента заранее на каждом узле: без этого холодный старт не укладывается в 30 секунд.
  prepull: true

# Память коммуникаций (FTR.NAB.CMN-0003 tech §12). Саму функцию разрешает
# администратор в «Настройках»; здесь — ёмкость сбора.
memory:
  collectConcurrency: 40  # одновременных запусков сборщика (MEMORY_COLLECT_CONCURRENCY)
  batchThreads: 20        # цепочек в пакете одного запуска
  runTimeout: 10m         # наибольшая длительность запуска
  backfillDays: 30        # глубина первого сбора
  backfillPoolShare: 0.3  # доля одновременных запусков под первый сбор
  gmailOverlap: 24h       # перекрытие поиска Gmail перед курсором
  # Отдельный пул оператора для сборщика. false — запуски идут в общий пул agent.
  pool:
    enabled: true
    replicas: 1
    maxRuns: 40           # запусков на под; держите replicas × maxRuns не меньше collectConcurrency
    resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "2", memory: 3Gi } }
    # Модель сбора у внешнего поставщика: пулу открыт интернет на 443 (кроме
    # частных диапазонов). false — модель внутри сети компании, интернет закрыт
    # целиком, а её адреса перечислены в egressAllow.
    egressInternet: true
    # CIDR модели сбора внутри сети компании.
    egressAllow: []

# Личные песочницы (FTR.NAB.CMN-0001 arch §5.2).
sandboxes:
  enabled: true
  namespace: nabu-sandboxes
  idleTimeout: 30m
  cpu: "1"
  memory: 1Gi
  spaceQuota: 5GB
  # CIDR, куда песочницам разрешены исходящие соединения (реестры пакетов и т. п.).
  egressAllow: []

ingress:
  className: traefik
  # Публичные префиксы API; служебный :9100 и внутренний :8081 не маршрутизируются.
  paths: [/api/, /admin/api/, /client/v1/, /hooks/, /auth/, /oauth/, /.well-known/]
  # Канал рабочих пространств (wss) — в relay.
  relayPaths: [/v1/workspaces/]

cleaner:
  schedule: "30 3 * * *"

replicas: { api: 1, worker: 1, agent: 1, relay: 1 }

resources:
  api:     { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
  worker:  { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
  agent:   { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "2", memory: 3Gi } }
  relay:   { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
  migrate: { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
  cleaner: { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }

podAnnotations: { prometheus.io/scrape: "true", prometheus.io/port: "9100" }
