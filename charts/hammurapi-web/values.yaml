# The web image; the rollout sets the tag (hammurapi-deploy).
image: { repository: ghcr.io/greenongrey/hammurapi-web, tag: "", pullPolicy: IfNotPresent }
imagePullSecrets: [{ name: ghcr-pull }]

# Base domain: SPA on hammurapi.<domain>, API on hammurapi-api.<domain>. Required.
publicBaseDomain: ""
# Subdomains of the site and API (the same as in the chart hammurapi-core).
hosts: { web: hammurapi, api: hammurapi-api }

ingress:
  className: traefik
  # A ClusterIssuer: the Ingress gets a certificate of its own, for controllers other than Traefik of the stand.
  clusterIssuer: ""

resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
