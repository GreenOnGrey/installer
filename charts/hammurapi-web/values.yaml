# Образ web; тег задаёт выкатка (hammurapi-deploy).
image: { repository: ghcr.io/greenongrey/hammurapi-web, tag: "", pullPolicy: IfNotPresent }
imagePullSecrets: [{ name: ghcr-pull }]

# Базовый домен: SPA на hammurapi.<домен>, API — на hammurapi-api.<домен>. Обязателен.
publicBaseDomain: ""
# Поддомены сайта и API (те же, что в чарте hammurapi-core).
hosts: { web: hammurapi, api: hammurapi-api }

ingress:
  className: traefik

resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
