apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "core.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "core.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "core.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- include "core.podSecurity" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "core.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: service, containerPort: 9100 }
          {{- include "core.env" . | nindent 10 }}
          readinessProbe: { httpGet: { path: /readyz, port: service }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: service }, initialDelaySeconds: 20, periodSeconds: 10 }
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
          {{- include "core.containerSecurity" . | nindent 10 }}
          {{- include "core.volumeMounts" . | nindent 10 }}
      {{- include "core.volumes" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "core.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector: {{- include "core.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  labels:
    {{- include "core.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  ingressClassName: {{ .Values.ingress.className }}
  # The default Traefik certificate, no secret of its own.
  tls: [{ hosts: [{{ include "core.apiHost" . | quote }}] }]
  rules:
    - host: {{ include "core.apiHost" . | quote }}
      http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend: { service: { name: api, port: { name: http } } }
          {{- end }}
