{{- if .Values.agent.enabled }}
# Оператор агента (FTR.HMR.CMN-0004): по процессу Pi на сессию чата или задачи.
# Получает только свой токен и настройки: ключи LLM и MCP приходят в запросах
# api и worker на открытие сессии, хранилища и GitHub ему не нужны.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels:
    {{- include "core.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  # Сессии живут в процессе: при обновлении старый под закрывается раньше нового,
  # чат восстанавливает сессию из снимка, задачи — повтором шага.
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "core.selector" (dict "root" . "component" "agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "core.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- include "core.podSecurity" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: agent
          image: {{ include "core.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["agent"]
          ports:
            - { name: http, containerPort: 8090 }
            - { name: service, containerPort: 9100 }
          env:
            - { name: AGENT_LISTEN_ADDR, value: ":8090" }
            - { name: SERVICE_ADDR, value: ":9100" }
            - { name: AGENT_WORKDIR, value: /work }
            - { name: AGENT_MAX_SESSIONS, value: {{ .Values.agent.maxSessions | quote }} }
            - { name: AGENT_MAX_TASK_SESSIONS, value: {{ .Values.agent.maxTaskSessions | quote }} }
            - { name: AGENT_IDLE_TIMEOUT, value: {{ .Values.agent.idleTimeout | quote }} }
            - name: AGENT_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecrets.config }}, key: AGENT_SERVICE_TOKEN } }
          readinessProbe: { httpGet: { path: /readyz, port: service }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: service }, initialDelaySeconds: 20, periodSeconds: 10 }
          resources: {{- toYaml .Values.resources.agent | nindent 12 }}
          {{- include "core.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: home, mountPath: /home/node }
            - { name: work, mountPath: /work }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: home, emptyDir: {} }
        - { name: work, emptyDir: { sizeLimit: {{ .Values.agent.workSizeLimit }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  labels:
    {{- include "core.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  selector: {{- include "core.selector" (dict "root" . "component" "agent") | nindent 4 }}
  ports:
    - { name: http, port: 8090, targetPort: http }
---
# К оператору — только api, worker и задачи runner (со своим токеном сессии).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent
  labels: {{- include "core.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "core.selector" (dict "root" . "component" "agent") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "core.selector" (dict "root" . "component" "api") | nindent 14 }}
        - podSelector:
            matchLabels: {{- include "core.selector" (dict "root" . "component" "worker") | nindent 14 }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.runners.namespace }} }
      ports: [{ port: 8090 }]
    # Метрики и пробы.
    - ports: [{ port: 9100 }]
---
# Сервер рабочей копии задачи runner (:{{ .Values.runners.workspacePort }}) — только для оператора агента.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-workspace
  namespace: {{ .Values.runners.namespace }}
  labels: {{- include "core.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} }
          podSelector:
            matchLabels: {{- include "core.selector" (dict "root" . "component" "agent") | nindent 14 }}
      ports: [{ port: {{ .Values.runners.workspacePort }} }]
{{- end }}
