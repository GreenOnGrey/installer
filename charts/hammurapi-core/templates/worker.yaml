# worker: Kafka, движок workflow, запуски служебных агентов Nabu, задачи кода в
# песочнице Nabu и MCP запусков (:8083, сервис worker-mcp). Прав в Kubernetes
# ему не нужно (FTR.HMR.CMN-0007 R3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "core.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "core.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "core.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
    spec:
      # Явно: без этого поля устаревший двойник serviceAccount в живом Deployment
      # вернёт удалённый ServiceAccount worker, и новые поды не создадутся.
      serviceAccountName: default
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "core.podSecurity" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "core.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          ports:
            - { name: mcp, containerPort: 8083 }
            - { name: service, containerPort: 9100 }
          {{- include "core.env" . | nindent 10 }}
          readinessProbe: { httpGet: { path: /readyz, port: service }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: service }, initialDelaySeconds: 20, periodSeconds: 10 }
          resources: {{- toYaml .Values.resources.worker | nindent 12 }}
          {{- include "core.containerSecurity" . | nindent 10 }}
          {{- include "core.volumeMounts" . | nindent 10 }}
      {{- include "core.volumes" . | nindent 6 }}
---
# MCP запусков: к нему ходят только служебные агенты Nabu.
apiVersion: v1
kind: Service
metadata:
  name: worker-mcp
  labels:
    {{- include "core.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector: {{- include "core.selector" (dict "root" . "component" "worker") | nindent 4 }}
  ports:
    - { name: mcp, port: 8083, targetPort: mcp }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker
  labels: {{- include "core.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "core.selector" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        # Служебные агенты Nabu с токеном сценария или задачи (FTR.HMR.CMN-0006 tech §3.4).
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.nabu.namespace }} }
      ports: [{ port: 8083 }]
    # Метрики и пробы.
    - ports: [{ port: 9100 }]
