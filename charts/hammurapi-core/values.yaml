# The core image; the rollout sets the tag (hammurapi-deploy).
image: { repository: ghcr.io/greenongrey/hammurapi-core, tag: "", pullPolicy: IfNotPresent }
imagePullSecrets: [{ name: ghcr-pull }]

# Base domain: site hammurapi.<domain>, API hammurapi-api.<domain>. Required.
publicBaseDomain: ""
# Subdomains of the site and API: on one stand with Nabu (nabu., nabu-api.).
hosts: { web: hammurapi, api: hammurapi-api }

# hammurapi-deploy creates secrets and configuration before Helm: the chart gets only
# references, and values stay out of the release history (R14).
existingSecrets:
  config: hammurapi-secrets        # GitHub App, webhook secret, encryption key
  configMap: hammurapi-config      # non-secret configuration from GitHub
  postgres: postgres-conn          # copies of the stand's secrets from storages
  kafka: kafka-conn
  s3: s3-conn

# Additional non-secret environment variables.
config: {}

# Code tasks in a Nabu sandbox (FTR.HMR.CMN-0007): how many run at once.
code:
  maxParallel: 2

# Nabu (FTR.HMR.CMN-0006, FTR.HMR.CMN-0007): Nabu service agents call the worker's MCP
# (worker-mcp:8083) from their namespace; webUrl is the Nabu site for links to runs.
nabu:
  namespace: nabu
  webUrl: ""

ingress:
  className: traefik
  # Only public prefixes; the service :9100 and internal :8081 are not routed.
  # /mcp/nabu is the MCP for personal Nabu agents (Nabu JWT, FTR.HMR.CMN-0006 R7).
  paths: [/api/, /admin/api/, /hooks/, /mcp/nabu]

cleaner:
  schedule: "0 3 * * *"

resources:
  api:       { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
  worker:    { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
  migrate:   { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
  cleaner:   { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }

podAnnotations: { prometheus.io/scrape: "true", prometheus.io/port: "9100" }
