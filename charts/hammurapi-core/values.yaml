# Образ core вместе с агентом; тег задаёт выкатка (hammurapi-deploy).
image: { repository: ghcr.io/greenongrey/hammurapi-core, tag: "", pullPolicy: IfNotPresent }
imagePullSecrets: [{ name: ghcr-pull }]

# Базовый домен: сайт hammurapi.<домен>, API hammurapi-api.<домен>. Обязателен.
publicBaseDomain: ""
# Поддомены сайта и API: на одном стенде с Nabu (nabu., nabu-api.).
hosts: { web: hammurapi, api: hammurapi-api }

# Секреты и конфигурация создаёт hammurapi-deploy до Helm: чарт получает только
# ссылки, значения не попадают в историю релизов (R14).
existingSecrets:
  config: hammurapi-secrets        # GitHub App, секрет вебхуков, ключ шифрования, токен оператора агента
  configMap: hammurapi-config      # несекретная конфигурация из GitHub
  postgres: postgres-conn          # копии секретов стенда из storages
  kafka: kafka-conn
  s3: s3-conn

# Дополнительные несекретные переменные окружения.
config: {}

runners:
  namespace: hammurapi-runners
  maxParallel: 2
  # Порт сервера рабочей копии задачи: к нему ходит только оператор агента (FTR.HMR.CMN-0004).
  workspacePort: 8095

# Оператор агента (режим agent, FTR.HMR.CMN-0004): процессы Pi по сессиям чата и задач.
# После переноса настроек агента в Nabu (FTR.HMR.CMN-0006 R10) — enabled: false.
agent:
  enabled: true
  maxSessions: 20         # всего процессов Pi
  maxTaskSessions: 4      # из них — сессий задач runner
  idleTimeout: 15m        # простой сессии до закрытия
  workSizeLimit: 2Gi      # каталоги сессий (/work)

# Nabu (FTR.HMR.CMN-0006): служебные агенты Nabu вызывают MCP воркера
# (worker-mcp:8083) и внутренний /mcp api (api-internal:8081) из своего namespace.
nabu:
  namespace: nabu

ingress:
  className: traefik
  # Только публичные префиксы; служебные :9100 и внутренний :8081 не маршрутизируются.
  # /mcp/nabu — MCP для персональных агентов Nabu (JWT Nabu, FTR.HMR.CMN-0006 R7).
  paths: [/api/, /admin/api/, /hooks/, /mcp/nabu]

cleaner:
  schedule: "0 3 * * *"

resources:
  api:       { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
  worker:    { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
  agent:     { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "2", memory: 3Gi } }
  migrate:   { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
  cleaner:   { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
  runnerJob: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "2", memory: 4Gi } }

podAnnotations: { prometheus.io/scrape: "true", prometheus.io/port: "9100" }
